method: "shapley"

model_name_or_path: "openai/gpt-4"
use_api: true
api_key: null
api_seed: 42
api_reasoning_effort: null
max_workers: 5

# AmbigQA ShaQ settings reported in the paper.
m: 3
n: 5
answer_temperature: 0.7
replace_temperature: 0.9

max_new_tokens_answer: 256
max_new_tokens_replace: 512
max_new_tokens_cluster: 2048
max_new_tokens_localize: 512

localizer_prompt_path: "prompts/localizer.txt"
premise_generator_prompt_path: "prompts/premise_generator.txt"
answerer_prompt_path: "prompts/answerer.txt"
clusterer_prompt_path: "prompts/clusterer.txt"

max_spans_for_shapley: 5
